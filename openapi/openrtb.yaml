openapi: 3.1.0
info:
  title: OakRTB OpenRTB Bidding API
  version: 0.2.0
  description: |
    JSON HTTP contract for OakRTB real-time bidding (`POST /openrtb/v2/auction`).

    Field names align with IAB OpenRTB 2.6 (snapshot 2.6-202606). OakRTB profile
    tightenings (enforced by JSON Schema): BidRequest requires `at` and `cur`;
    BidResponse requires `cur`. See docs/spec.md.

    Exchange POSTs a BidRequest; bidder returns BidResponse (200), empty no-bid
    (204), or BidResponse with `nbr`.

    Optional `application/x-protobuf` is defined by proto/oakrtb/v2/openrtb.proto
    and docs/transport.md — not modeled in this OpenAPI document.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  contact:
    url: https://github.com/oakrtb/openrtb

servers:
  - url: https://bidder.example.com
    description: DSP / bidder endpoint

paths:
  /openrtb/v2/auction:
    post:
      operationId: auction
      summary: Submit a bid request
      description: |
        The exchange sends one BidRequest per auction. `tmax` includes network
        latency. Timed-out bids are treated as no-bid.
      parameters:
        - in: header
          name: x-openrtb-version
          required: false
          schema:
            type: string
            example: "2.6"
          description: |
            OpenRTB protocol version of the request body (major.minor, e.g. "2.6").
            OakRTB object model is aligned to dated snapshot 2.6-202606.
        - in: header
          name: Content-Type
          required: false
          schema:
            type: string
            enum:
              - application/json
              - application/json; charset=utf-8
          description: |
            JSON body media type. If omitted, treat as application/json
            (see docs/transport.md). Protobuf uses application/x-protobuf and
            is outside this OpenAPI contract.
        - in: header
          name: Accept-Encoding
          required: false
          schema:
            type: string
            description: |
              Comma-separated content codings the exchange can decode on the
              response (RFC 9110). Tokens may include qvalues.
              Supported: gzip, deflate, br, zstd. Omit for uncompressed responses.
            examples:
              - gzip
              - gzip, br, zstd;q=0.8
              - gzip, deflate, br, zstd
          example: gzip, br, zstd;q=0.8
        - in: header
          name: Content-Encoding
          required: false
          schema:
            type: string
            description: |
              Encoding applied to this request body. Single token only.
              Supported: gzip, deflate, br, zstd. Omit when uncompressed.
            enum:
              - gzip
              - deflate
              - br
              - zstd
            example: gzip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schema/jsonschema/bid-request.schema.json"
            examples:
              banner:
                $ref: "#/components/examples/BannerBidRequest"
      responses:
        "200":
          description: Bid or structured no-bid (`nbr`).
          headers:
            x-openrtb-version:
              schema:
                type: string
                example: "2.6"
            Content-Encoding:
              description: |
                Encoding of the response body. Must be one of the algorithms
                listed in the request Accept-Encoding (or omitted if none).
                Supported: gzip, deflate, br, zstd.
              schema:
                type: string
                enum:
                  - gzip
                  - deflate
                  - br
                  - zstd
                example: gzip
          content:
            application/json:
              schema:
                $ref: "../schema/jsonschema/bid-response.schema.json"
              examples:
                bid:
                  $ref: "#/components/examples/BannerBidResponse"
                nbr:
                  $ref: "#/components/examples/NoBidResponse"
        "204":
          description: No-bid with empty body.
        "400":
          description: |
            Malformed JSON, or BidRequest failed JSON Schema validation.
            Body is a ValidationResult with ok=false.
          content:
            application/json:
              schema:
                $ref: "../schema/jsonschema/validation-result.schema.json"
              examples:
                missingImp:
                  $ref: "#/components/examples/ValidationFailed"

components:
  examples:
    BannerBidRequest:
      summary: Simple 300x250 banner
      value:
        id: "80ce30c53c16e6ede735f123ef6e32361bfc7b22"
        at: 1
        tmax: 120
        cur: ["USD"]
        imp:
          - id: "1"
            bidfloor: 0.03
            bidfloorcur: "USD"
            banner:
              w: 300
              h: 250
        site:
          id: "102855"
          domain: "www.example.com"
          page: "https://www.example.com/article"
    BannerBidResponse:
      summary: Winning banner bid
      value:
        id: "80ce30c53c16e6ede735f123ef6e32361bfc7b22"
        bidid: "abc123"
        cur: "USD"
        seatbid:
          - seat: "512"
            bid:
              - id: "1"
                impid: "1"
                price: 1.23
                adomain: ["advertiser.com"]
                crid: "creative-9"
                mtype: 1
                w: 300
                h: 250
                adm: "<a href='https://advertiser.com'><img src='https://cdn.example/ad.png'/></a>"
                nurl: "https://dsp.example/win?price=${AUCTION_PRICE}"
    NoBidResponse:
      summary: Structured no-bid
      value:
        id: "80ce30c53c16e6ede735f123ef6e32361bfc7b22"
        cur: "USD"
        nbr: 2
    ValidationFailed:
      summary: Schema validation failed
      value:
        ok: false
        errors:
          - code: required
            path: "/imp"
            message: "'imp' is a required property"
