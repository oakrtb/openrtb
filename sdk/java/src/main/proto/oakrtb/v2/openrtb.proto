  SLOT_IN_POD_FIRST = 1;               // 仅第一/开头
  SLOT_IN_POD_FIRST_OR_LAST = 2;       // 第一或最后
  SLOT_IN_POD_FIRST_MIDDLE_OR_LAST = 3; // 第一/中间/最后均可
