syntax = "proto3";

package oakrtb.v2;

option go_package = "github.com/oakrtb/openrtb/sdk/go/oakrtb/v2;openrtb";
option java_package = "com.oakrtb.openrtb.v2";
option java_multiple_files = true;
option java_outer_classname = "OpenRtbProto";

// OakRTB protocol 0.2.0 — OpenRTB 2.6-202606 的 protobuf 编码。
// JSON 字段名与 IAB OpenRTB 2.6 对齐，同一业务载荷可走 application/json 或 application/x-protobuf。
//
// 权威校验仍以 schema/jsonschema 为准（required / site·app·dooh 互斥 / mtype∈{1..4} 等）。
// Proto3 无法表达上述约束：标量缺省为 0/""，不等于 JSON「缺字段 = unknown」。
// 含下划线的 OpenRTB 字段须带 json_name，避免默认 protobuf JSON 变成 camelCase。
// 注释约定：每个 message/enum 须说明结构用途与场景；每个字段/枚举值须说明含义；
// 可枚举整型字段在注释中写明取值来源（对应 enum）及关键取值释义；特殊值（如 startdelay/slotinpod 负值）就地写清。
// 可枚举整型字段：标准取值定义在上方 enum（源自 OpenRTB 2.6 / AdCOM 1.0）；
// 字段类型保持 int32，以便兼容 >=500 厂商扩展及 startdelay/slotinpod 等特殊负值。
// ext 统一编码为 JSON 对象字符串，避免依赖 google.protobuf.Struct。

// ---------------------------------------------------------------------------
// 枚举
// ---------------------------------------------------------------------------

// MarkupType：素材形态，对应 Bid.mtype，并暗示 Imp 下应出现的子对象。
// 场景：同一 Imp 同时带 banner/video 等多形态时，出价必须用 mtype 声明中了哪一种。
// JSON Schema 仅允许 1–4；0 仅作 proto 未设哨兵，合法 JSON 出价不得写 mtype:0。
enum MarkupType {
  MARKUP_TYPE_UNSPECIFIED = 0; // 未指定（proto 缺省）；JSON 线格式勿使用
  MARKUP_TYPE_BANNER = 1;      // 横幅/展示；对应 Imp.banner
  MARKUP_TYPE_VIDEO = 2;       // 视频；对应 Imp.video
  MARKUP_TYPE_AUDIO = 3;       // 音频；对应 Imp.audio
  MARKUP_TYPE_NATIVE = 4;      // 原生；对应 Imp.native
}

// AuctionType：拍卖结算方式。
// 场景：BidRequest.at 描述整场拍卖；Deal.at 可额外用固定价（3）。
enum AuctionType {
  AUCTION_TYPE_UNSPECIFIED = 0;       // 未指定
  AUCTION_TYPE_FIRST_PRICE = 1;       // 一价：胜出者付自己的出价
  AUCTION_TYPE_SECOND_PRICE_PLUS = 2; // 二价+：付次高价（可加增量）；BidRequest.at 常用此值（现为必填字段）
  AUCTION_TYPE_FIXED_PRICE = 3;       // 固定价；仅 Deal.at
  // >=500：Exchange 自定义拍卖类型
}

// BannerAdType：Banner.btype 屏蔽的横幅类型（OpenRTB Banner Ad Types）。
enum BannerAdType {
  BANNER_AD_TYPE_UNSPECIFIED = 0; // 未指定
  BANNER_AD_TYPE_XHTML_TEXT = 1;    // XHTML 文本广告（多为移动）
  BANNER_AD_TYPE_XHTML_BANNER = 2;  // XHTML Banner
  BANNER_AD_TYPE_JAVASCRIPT = 3;    // JavaScript 广告
  BANNER_AD_TYPE_IFRAME = 4;        // iframe
}

// CreativeAttribute：Banner/Video/Audio/Native.battr 与 Bid.attr。
// >=500 为厂商自定义。
enum CreativeAttribute {
  CREATIVE_ATTRIBUTE_UNSPECIFIED = 0; // 未指定
  CREATIVE_ATTRIBUTE_AUDIO_AUTOPLAY = 1;              // 音频广告（自动播放）
  CREATIVE_ATTRIBUTE_AUDIO_USER_INITIATED = 2;       // 音频广告（用户触发）
  CREATIVE_ATTRIBUTE_EXPANDABLE_AUTOMATIC = 3;       // 可扩展（自动）
  CREATIVE_ATTRIBUTE_EXPANDABLE_CLICK = 4;           // 可扩展（点击触发）
  CREATIVE_ATTRIBUTE_EXPANDABLE_ROLLOVER = 5;        // 可扩展（悬停触发）
  CREATIVE_ATTRIBUTE_IN_BANNER_VIDEO_AUTOPLAY = 6;   // Banner 内视频（自动播放）
  CREATIVE_ATTRIBUTE_IN_BANNER_VIDEO_USER = 7;       // Banner 内视频（用户触发）
  CREATIVE_ATTRIBUTE_POP = 8;                        // 弹出（Over/Under/Exit）
  CREATIVE_ATTRIBUTE_PROVOCATIVE = 9;                // 挑逗/暗示性画面
  CREATIVE_ATTRIBUTE_ANNOYING = 10;                  // 抖动/闪烁/极端动画等
  CREATIVE_ATTRIBUTE_SURVEYS = 11;                   // 问卷
  CREATIVE_ATTRIBUTE_TEXT_ONLY = 12;                 // 纯文本
  CREATIVE_ATTRIBUTE_USER_INTERACTIVE = 13;          // 用户互动（如嵌入游戏）
  CREATIVE_ATTRIBUTE_ALERT_STYLE = 14;               // 系统对话框/警告样式
  CREATIVE_ATTRIBUTE_HAS_AUDIO_TOGGLE = 15;          // 有声音开关
  CREATIVE_ATTRIBUTE_HAS_SKIP_BUTTON = 16;           // 提供跳过按钮
  CREATIVE_ATTRIBUTE_FLASH = 17;                     // Adobe Flash
  CREATIVE_ATTRIBUTE_RESPONSIVE = 18;                // 响应式/无固定尺寸/流体
}

// AdPosition：Banner.pos / Video.pos（AdCOM Placement Positions）。
enum AdPosition {
  AD_POSITION_UNKNOWN = 0;      // 未知
  AD_POSITION_ABOVE_THE_FOLD = 1; // 首屏上方
  AD_POSITION_LOCKED = 2;       // 固定锁定位置
  AD_POSITION_BELOW_THE_FOLD = 3; // 首屏下方
  AD_POSITION_HEADER = 4;       // 页头
  AD_POSITION_FOOTER = 5;       // 页脚
  AD_POSITION_SIDEBAR = 6;      // 侧栏
  AD_POSITION_FULLSCREEN = 7;   // 全屏
}

// ExpandableDirection：Banner.expdir。
enum ExpandableDirection {
  EXPANDABLE_DIRECTION_UNSPECIFIED = 0; // 未指定
  EXPANDABLE_DIRECTION_LEFT = 1;        // 向左
  EXPANDABLE_DIRECTION_RIGHT = 2;       // 向右
  EXPANDABLE_DIRECTION_UP = 3;          // 向上
  EXPANDABLE_DIRECTION_DOWN = 4;        // 向下
  EXPANDABLE_DIRECTION_FULLSCREEN = 5;  // 全屏
  EXPANDABLE_DIRECTION_RESIZE = 6;      // 缩小/最小化
}

// ApiFramework：banner/video/audio/native.api 与 Bid.apis。>=500 厂商自定义。
enum ApiFramework {
  API_FRAMEWORK_UNSPECIFIED = 0; // 未指定
  API_FRAMEWORK_VPAID_1 = 1;   // VPAID 1.0
  API_FRAMEWORK_VPAID_2 = 2;   // VPAID 2.0
  API_FRAMEWORK_MRAID_1 = 3;   // MRAID 1.0
  API_FRAMEWORK_ORMMA = 4;     // ORMMA
  API_FRAMEWORK_MRAID_2 = 5;   // MRAID 2.0
  API_FRAMEWORK_MRAID_3 = 6;   // MRAID 3.0
  API_FRAMEWORK_OMID_1 = 7;    // OMID 1.0（Open Measurement）
  API_FRAMEWORK_SIMID_1 = 8;   // SIMID 1.0
  API_FRAMEWORK_SIMID_1_1 = 9; // SIMID 1.1
}

// Protocol：Video/Audio.protocols 与 Bid.protocol（VAST/DAAST 版本）。
enum Protocol {
  PROTOCOL_UNSPECIFIED = 0; // 未指定
  PROTOCOL_VAST_1_0 = 1; // VAST 1.0
  PROTOCOL_VAST_2_0 = 2; // VAST 2.0
  PROTOCOL_VAST_3_0 = 3; // VAST 3.0
  PROTOCOL_VAST_1_0_WRAPPER = 4; // VAST 1.0 Wrapper
  PROTOCOL_VAST_2_0_WRAPPER = 5; // VAST 2.0 Wrapper
  PROTOCOL_VAST_3_0_WRAPPER = 6; // VAST 3.0 Wrapper
  PROTOCOL_VAST_4_0 = 7; // VAST 4.0
  PROTOCOL_VAST_4_0_WRAPPER = 8; // VAST 4.0 Wrapper
  PROTOCOL_DAAST_1_0 = 9; // DAAST 1.0
  PROTOCOL_DAAST_1_0_WRAPPER = 10; // DAAST 1.0 Wrapper
  PROTOCOL_VAST_4_1 = 11; // VAST 4.1
  PROTOCOL_VAST_4_1_WRAPPER = 12; // VAST 4.1 Wrapper
  PROTOCOL_VAST_4_2 = 13; // VAST 4.2
  PROTOCOL_VAST_4_2_WRAPPER = 14; // VAST 4.2 Wrapper
  PROTOCOL_VAST_4_3 = 15; // VAST 4.3
  PROTOCOL_VAST_4_3_WRAPPER = 16; // VAST 4.3 Wrapper
}

// VideoPlcmt：Video.plcmt（OpenRTB 2.6-202303+，替代旧 placement）。
enum VideoPlcmt {
  VIDEO_PLCMT_UNSPECIFIED = 0; // 未指定
  VIDEO_PLCMT_INSTREAM = 1;              // 随主内容播；默认有声；前/中/后贴
  VIDEO_PLCMT_ACCOMPANYING_CONTENT = 2;  // 伴随图文；入视口播放
  VIDEO_PLCMT_INTERSTITIAL = 3;          // 插屏占满视口，不可滚走
  VIDEO_PLCMT_NO_CONTENT = 4;            // 无视频内容：幻灯/信息流/悬浮播放器等
  VIDEO_PLCMT_PAUSE = 5;                 // 用户暂停内容时展示（AdCOM 新增值）
  VIDEO_PLCMT_SCREENSAVER = 6;           // 屏保场景
  VIDEO_PLCMT_OVERLAY = 7;               // 叠在内容上（非传统广告歇）
  VIDEO_PLCMT_SQUEEZEBACK = 8;           // 内容缩小与广告分屏
  VIDEO_PLCMT_IN_SCENE = 9;              // 植入内容画面
}

// VideoLinearity：Video.linearity（期望的 VAST 响应形态）。
enum VideoLinearity {
  VIDEO_LINEARITY_UNSPECIFIED = 0; // 未指定
  VIDEO_LINEARITY_LINEAR = 1;      // 线性贴片（含视频资产）
  VIDEO_LINEARITY_NON_LINEAR = 2;  // 非线性/Overlay
}

// PlaybackMethod：Video.playbackmethod。
enum PlaybackMethod {
  PLAYBACK_METHOD_UNSPECIFIED = 0; // 未指定
  PLAYBACK_METHOD_PAGE_LOAD_SOUND_ON = 1;      // 页加载即播，有声
  PLAYBACK_METHOD_PAGE_LOAD_SOUND_OFF = 2;     // 页加载即播，默认静音
  PLAYBACK_METHOD_CLICK_SOUND_ON = 3;          // 点击播放，有声
  PLAYBACK_METHOD_MOUSE_OVER_SOUND_ON = 4;     // 悬停播放，有声
  PLAYBACK_METHOD_VIEWPORT_SOUND_ON = 5;       // 进入视口播放，有声
  PLAYBACK_METHOD_VIEWPORT_SOUND_OFF = 6;      // 进入视口播放，默认静音
  PLAYBACK_METHOD_CONTINUOUS = 7;              // 连续播放直至用户停止
}

// PlaybackCessationMode：Video.playbackend。
enum PlaybackCessationMode {
  PLAYBACK_CESSATION_UNSPECIFIED = 0; // 未指定
  PLAYBACK_CESSATION_COMPLETION_OR_USER = 1;           // 播完或用户终止
  PLAYBACK_CESSATION_LEAVING_VIEWPORT_OR_USER = 2;     // 离开视口或用户终止
  PLAYBACK_CESSATION_FLOATING_UNTIL_COMPLETION = 3;   // 离视口后悬浮继续直至播完/用户终止
}

// DeliveryMethod：Video/Audio.delivery。
enum DeliveryMethod {
  DELIVERY_METHOD_UNSPECIFIED = 0; // 未指定
  DELIVERY_METHOD_STREAMING = 1;     // 流式
  DELIVERY_METHOD_PROGRESSIVE = 2;   // 渐进下载
  DELIVERY_METHOD_DOWNLOAD = 3;      // 完整下载
}

// CompanionType：Video/Audio.companiontype。
enum CompanionType {
  COMPANION_TYPE_UNSPECIFIED = 0; // 未指定
  COMPANION_TYPE_STATIC = 1;   // Static Resource
  COMPANION_TYPE_HTML = 2;     // HTML Resource
  COMPANION_TYPE_IFRAME = 3;   // iframe Resource
}

// VideoCompanionMode：Banner.vcm（视频伴生模式）。
enum VideoCompanionMode {
  VIDEO_COMPANION_MODE_CONCURRENT = 0; // 与视频同时展示
  VIDEO_COMPANION_MODE_END_CARD = 1;   // 视频结束后的 end card
}

// DeviceType：Device.devicetype（AdCOM Device Types）。
enum DeviceType {
  DEVICE_TYPE_UNSPECIFIED = 0; // 未指定
  DEVICE_TYPE_MOBILE_TABLET_GENERAL = 1; // 通用移动（4/5 未知时）
  DEVICE_TYPE_PERSONAL_COMPUTER = 2;     // PC/笔记本浏览器
  DEVICE_TYPE_CONNECTED_TV = 3;          // 智能电视 / CTV
  DEVICE_TYPE_PHONE = 4;                 // 手机
  DEVICE_TYPE_TABLET = 5;                // 平板
  DEVICE_TYPE_CONNECTED_DEVICE = 6;      // 主机/流媒体盒等非 TV
  DEVICE_TYPE_SET_TOP_BOX = 7;           // 运营商机顶盒
  DEVICE_TYPE_OOH_DEVICE = 8;            // 户外屏设备
}

// ConnectionType：Device.connectiontype。0=未知。
enum ConnectionType {
  CONNECTION_TYPE_UNKNOWN = 0;           // 未知
  CONNECTION_TYPE_ETHERNET = 1;          // 有线以太网
  CONNECTION_TYPE_WIFI = 2;              // Wi‑Fi
  CONNECTION_TYPE_CELLULAR_UNKNOWN = 3;  // 蜂窝（代数未知）
  CONNECTION_TYPE_CELLULAR_2G = 4; // 蜂窝 2G
  CONNECTION_TYPE_CELLULAR_3G = 5; // 蜂窝 3G
  CONNECTION_TYPE_CELLULAR_4G = 6; // 蜂窝 4G
  CONNECTION_TYPE_CELLULAR_5G = 7; // 蜂窝 5G
}

// LocationType：Geo.type。
enum LocationType {
  LOCATION_TYPE_UNSPECIFIED = 0; // 未指定
  LOCATION_TYPE_GPS = 1;             // GPS/系统定位服务
  LOCATION_TYPE_IP = 2;              // IP 推断
  LOCATION_TYPE_USER_PROVIDED = 3;   // 用户提供（如注册资料）
}

// IpLocationService：Geo.ipservice。
enum IpLocationService {
  IP_LOCATION_SERVICE_UNSPECIFIED = 0; // 未指定
  IP_LOCATION_SERVICE_IP2LOCATION = 1; // IP2Location
  IP_LOCATION_SERVICE_NEUSTAR = 2;       // Neustar (Quova)
  IP_LOCATION_SERVICE_MAXMIND = 3; // MaxMind
  IP_LOCATION_SERVICE_NETACUITY = 4;     // Digital Element
}

// ContentContext：Content.context。
enum ContentContext {
  CONTENT_CONTEXT_UNSPECIFIED = 0; // 未指定
  CONTENT_CONTEXT_VIDEO = 1;        // 视频文件/流
  CONTENT_CONTEXT_GAME = 2;         // 游戏
  CONTENT_CONTEXT_MUSIC = 3;        // 音乐/电台流
  CONTENT_CONTEXT_APPLICATION = 4;  // 应用
  CONTENT_CONTEXT_TEXT = 5;         // 文本页/文章
  CONTENT_CONTEXT_OTHER = 6;        // 其他
  CONTENT_CONTEXT_UNKNOWN = 7;      // 未知
}

// ProductionQuality：Content.prodq。
enum ProductionQuality {
  PRODUCTION_QUALITY_UNKNOWN = 0;         // 未知
  PRODUCTION_QUALITY_PROFESSIONAL = 1;    // 专业制作
  PRODUCTION_QUALITY_PROSUMER = 2;        // 准专业
  PRODUCTION_QUALITY_USER_GENERATED = 3;  // UGC
}

// MediaRating：Content.qagmediarating / Bid.qagmediarating（QAG/IQG）。
enum MediaRating {
  MEDIA_RATING_UNSPECIFIED = 0; // 未指定
  MEDIA_RATING_ALL_AUDIENCES = 1;   // 全年龄
  MEDIA_RATING_OVER_12 = 2;         // 12 岁以上
  MEDIA_RATING_MATURE = 3;          // 成人向
}

// CategoryTaxonomy：*.cattax。>=500 厂商自定义。
enum CategoryTaxonomy {
  CATEGORY_TAXONOMY_UNSPECIFIED = 0; // 未指定
  CATEGORY_TAXONOMY_IAB_CONTENT_1_0 = 1;   // IAB Content Category 1.0（已不推荐）
  CATEGORY_TAXONOMY_IAB_CONTENT_2_0 = 2;   // IAB Content Category 2.0（已不推荐）
  CATEGORY_TAXONOMY_IAB_AD_PRODUCT_1_0 = 3; // IAB Ad Product Taxonomy 1.0
  CATEGORY_TAXONOMY_IAB_AUDIENCE_1_1 = 4;  // IAB Audience Taxonomy 1.1
  CATEGORY_TAXONOMY_IAB_CONTENT_2_1 = 5;   // IAB Content Taxonomy 2.1
  CATEGORY_TAXONOMY_IAB_CONTENT_2_2 = 6;   // IAB Content Taxonomy 2.2
  CATEGORY_TAXONOMY_IAB_CONTENT_3_0 = 7;   // IAB Content Taxonomy 3.0（若实现支持）
}

// FeedType：Audio.feed。
enum FeedType {
  FEED_TYPE_UNSPECIFIED = 0; // 未指定
  FEED_TYPE_MUSIC_SERVICE = 1;   // 音乐服务
  FEED_TYPE_FM_AM_BROADCAST = 2; // 调频/调幅广播
  FEED_TYPE_PODCAST = 3;         // 播客
}

// VolumeNormalizationMode：Audio.nvol。
enum VolumeNormalizationMode {
  VOLUME_NORM_NONE = 0;                 // 无
  VOLUME_NORM_AVERAGE = 1;              // 按内容平均音量归一
  VOLUME_NORM_PEAK = 2;                 // 按内容峰值归一
  VOLUME_NORM_LOUDNESS = 3;             // 响度归一
  VOLUME_NORM_CUSTOM = 4;               // 自定义归一
}

// AgentType：UID.atype。>=500 厂商自定义。
enum AgentType {
  AGENT_TYPE_UNSPECIFIED = 0; // 未指定
  AGENT_TYPE_WEB_OR_DEVICE = 1;  // 浏览器/设备级 ID（cookie 等）
  AGENT_TYPE_IN_APP = 2;         // App 内（设备广告 ID 等）
  AGENT_TYPE_PERSON = 3;         // 跨设备人物级 ID
}

// NoBidReason：BidResponse.nbr。>=500 Exchange 自定义。
enum NoBidReason {
  NO_BID_REASON_UNKNOWN_ERROR = 0;              // 未知错误
  NO_BID_REASON_TECHNICAL_ERROR = 1;            // 技术错误
  NO_BID_REASON_INVALID_REQUEST = 2;            // 请求非法
  NO_BID_REASON_KNOWN_WEB_SPIDER = 3;           // 已知爬虫
  NO_BID_REASON_SUSPECTED_NONHUMAN = 4;         // 疑似非人流量
  NO_BID_REASON_CLOUD_OR_PROXY_IP = 5;          // 云/机房/代理 IP
  NO_BID_REASON_UNSUPPORTED_DEVICE = 6;         // 不支持的设备
  NO_BID_REASON_BLOCKED_PUBLISHER = 7;          // 屏蔽的发布商/站点
  NO_BID_REASON_UNMATCHED_USER = 8;             // 用户未匹配
  NO_BID_REASON_DAILY_READER_CAP = 9;           // 日读者上限
  NO_BID_REASON_DAILY_DOMAIN_CAP = 10;          // 日域名上限
}

// FlagBool：通用 0/1 开关字段（test/instl/secure/skip/rwdd 等）。
enum FlagBool {
  FLAG_FALSE = 0; // 否 / 关闭 / 生产（视字段而定）
  FLAG_TRUE = 1;  // 是 / 开启 / 测试（视字段而定）
}

// Ssai：Imp.ssai 服务端广告插入。
enum Ssai {
  SSAI_UNKNOWN = 0;          // 未知
  SSAI_CLIENT = 1;           // 客户端插入
  SSAI_SERVER = 2;           // 服务端插入（SSAI）
  SSAI_MIXED = 3;            // 客户端+服务端混合
}

// QtySourceType：Qty.sourcetype。
enum QtySourceType {
  QTY_SOURCE_MEASUREMENT_VENDOR = 0; // 度量厂商通用方法（CMM 等）
  QTY_SOURCE_PUBLISHER = 1;          // 发布商/厂商特定方法
}

// SlotInPod：Video/Audio/Bid.slotinpod（标准非负取值；-1=最后槽见字段注释）。
