  AUTO_REFRESH_TRIGGER_USER_ACTION = 1;   // 用户动作触发刷新
  AUTO_REFRESH_TRIGGER_EVENT = 2;         // 事件驱动（如内容交互）
  AUTO_REFRESH_TRIGGER_TIME = 3;          // 按时间间隔自动刷新
