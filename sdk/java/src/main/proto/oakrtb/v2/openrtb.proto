enum PodSequence {
  POD_SEQUENCE_ANY = 0;    // 任意 pod
  POD_SEQUENCE_FIRST = 1;  // 第一个 pod
}

// SourceRelationship：Content.sourcerelationship。
enum SourceRelationship {
  SOURCE_RELATIONSHIP_INDIRECT = 0; // 间接
  SOURCE_RELATIONSHIP_DIRECT = 1;   // 直接
}

// UserAgentSource：UserAgent.source（SUA 数据来源）。
enum UserAgentSource {
  USER_AGENT_SOURCE_UNSPECIFIED = 0;          // 未知/不适用
  USER_AGENT_SOURCE_CLIENT_HINTS_LOW = 1;     // 仅低熵 Client Hints
  USER_AGENT_SOURCE_CLIENT_HINTS_HIGH = 2;    // 含高熵 Client Hints
  USER_AGENT_SOURCE_USER_AGENT_STRING = 3;    // 原始 UA 字符串解析
