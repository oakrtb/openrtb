[package]
name = "oakrtb-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "OakRTB OpenRTB models and JSON Schema validation"
license = "Apache-2.0"
repository = "https://github.com/oakrtb/openrtb"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
jsonschema = "0.55.1"
prost = "0.14.4"
thiserror = "2.0.20"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
walkdir = "2.5.0"
